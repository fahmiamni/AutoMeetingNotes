services:
  worker:
    build: .
    image: automeetingnotes:latest
    command: python main.py --watch
    restart: unless-stopped
    env_file: .env
    environment:
      INPUT_DIR: /app/input
    volumes:
      - pipeline-output:/app/output
      - hf-cache:/root/.cache/huggingface
      - ${INPUT_DIR:-./input}:/app/input

volumes:
  pipeline-output:
  hf-cache:
