services:
  worker:
    build: .
    image: automeetingnotes:latest
    # Safety net (Linux): if the mounted input folder arrived root-owned, hand it
    # back to the host user running docker, so files can be added between runs.
    command: sh -c "chown -R $$(id -u):$$(id -g) /app/input 2>/dev/null; python main.py --watch"
    restart: unless-stopped
    env_file: .env
    environment:
      INPUT_DIR: /app/input
    volumes:
      - pipeline-output:/app/output
      - hf-cache:/root/.cache/huggingface
      - ${INPUT_DIR:-./input}:/app/input

volumes:
  pipeline-output:
  hf-cache:
